<title>AFTI Staff Start Page</title>
<style>
  :root{
    --green:#6CC067;
    --gray:#6D6E71;
    --bg:#FFFFFF;
    --tint:#E3F3E2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--gray);
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    min-height:100dvh;
    padding:2.5rem 1.5rem 2rem;
  }

  /* Clock / date, top corner */
  #clock{
    position:fixed;
    top:1.1rem;
    right:1.4rem;
    text-align:right;
    font-size:0.78rem;
    color:var(--gray);
    opacity:0.75;
    line-height:1.3;
    user-select:none;
  }
  #clock .time{
    font-size:0.95rem;
    font-weight:600;
    color:var(--gray);
  }

  /* Logo */
  .logo-wrap{
    margin-top:1rem;
    margin-bottom:2.5rem;
    text-align:center;
  }
  .logo-wrap img{
    max-width:280px;
    width:100%;
    height:auto;
    display:block;
    margin:0 auto;
  }

  @media (max-width:600px){
    body{ padding:4rem 1rem 6.5rem; } /* extra top clearance for clock, bottom clearance for search bar */
    #clock{
      top:0.7rem;
      right:0.9rem;
      font-size:0.68rem;
    }
    #clock .time{ font-size:0.82rem; }
    .logo-wrap{ margin-bottom:1.6rem; }
    .logo-wrap img{ max-width:200px; }
    .logo-fallback{ font-size:1rem; }
  }
  .logo-fallback{
    display:none;
    align-items:center;
    justify-content:center;
    gap:0.6rem;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--gray);
  }
  .logo-fallback .mark{
    width:34px;
    height:34px;
    border-radius:8px;
    background:var(--green);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:1rem;
    font-weight:800;
  }
  .logo-fallback .word b{ color:var(--green); }

  /* Quote */
  #quote{
    max-width:520px;
    text-align:center;
    font-style:italic;
    font-size:0.95rem;
    line-height:1.55;
    color:var(--gray);
    margin-bottom:3rem;
    padding:0 1rem;
  }
  #quote .attr{
    display:block;
    margin-top:0.5rem;
    font-style:normal;
    font-size:0.8rem;
    color:var(--green);
    letter-spacing:0.02em;
  }

  /* Link grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(70px, 84px));
    gap:1.6rem 1.8rem;
    justify-content:center;
    margin-bottom:3rem;
  }
  @media (max-width:560px){
    .grid{
      grid-template-columns:repeat(4, minmax(56px, 68px));
      gap:1.2rem 1rem;
      margin-bottom:2rem;
    }
    .tile .icon{ width:50px; height:50px; border-radius:12px; }
  }
  @media (max-width:340px){
    .grid{ grid-template-columns:repeat(3, minmax(56px, 68px)); }
  }
  .tile{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
  }
  .tile .icon{
    width:56px;
    height:56px;
    border-radius:14px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    border:1px solid rgba(0,0,0,0.08);
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .tile .icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .tile:hover .icon{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.14);
  }
  .tile .label{
    margin-top:0.55rem;
    font-size:0.68rem;
    color:var(--gray);
    opacity:0;
    transform:translateY(-4px);
    transition:opacity 0.15s ease, transform 0.15s ease;
    white-space:nowrap;
    text-align:center;
  }
  .tile:hover .label{
    opacity:1;
    transform:translateY(0);
  }

  /* Claude search box, secondary/off to the side */
  .claude-search{
    position:fixed;
    bottom:1.6rem;
    right:1.6rem;
    display:flex;
    align-items:center;
    gap:0.4rem;
  }
  .claude-search input{
    width:190px;
    font-size:0.78rem;
    padding:0.5rem 0.7rem;
    border:1px solid #ddd;
    border-radius:8px;
    color:var(--gray);
    background:#fff;
    outline:none;
    transition:border-color 0.15s ease;
  }
  .claude-search input:focus{ border-color:var(--green); }
  .claude-search button{
    font-size:0.75rem;
    padding:0.5rem 0.7rem;
    border:none;
    border-radius:8px;
    background:var(--green);
    color:#fff;
    cursor:pointer;
    opacity:0.9;
  }
  .claude-search button:hover{ opacity:1; }
  .claude-search .cs-label{
    font-size:0.65rem;
    color:var(--gray);
    opacity:0.6;
    position:absolute;
    top:-1.1rem;
    left:0;
  }

  @media (max-width:600px){
    .claude-search{
      bottom:0.8rem;
      right:0.8rem;
      left:0.8rem;
    }
    .claude-search form{
      width:100%;
    }
    .claude-search input{
      width:auto;
      flex:1;
    }
  }

  footer.meta{
    margin-top:auto;
    padding-top:2rem;
    font-size:0.65rem;
    color:var(--gray);
    opacity:0.45;
    text-align:center;
  }
</style>
</head>
<body>

  <div id="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date" id="clock-date">Loading date…</div>

const grid = document.getElementById('link-grid');
LINKS.forEach(link => {
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = link.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.title = link.label;
  a.innerHTML = `<span class="icon"><img src="${link.icon}" alt="" loading="lazy"></span><span class="label">${link.label}</span>`;
  grid.appendChild(a);
});

// ---------------------------------------------------------------
// Clock / date
// ---------------------------------------------------------------
function updateClock(){
  const now = new Date();
  const timeEl = document.getElementById('clock-time');
  const dateEl = document.getElementById('clock-date');
  timeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 15000);

// ---------------------------------------------------------------
// Daily quote: fetched from quotes.json, selected by day-of-year % length
// so every staff member sees the same quote on a given day.
// ---------------------------------------------------------------
function dayOfYear(date){
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = (date - start);
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

fetch('quotes.json')
  .then(res => {
    if (!res.ok) throw new Error('quotes.json not found');
    return res.json();
  })
  .then(quotes => {
    if (!Array.isArray(quotes) || quotes.length === 0) throw new Error('quotes.json empty');
    const idx = dayOfYear(new Date()) % quotes.length;
    const q = quotes[idx];
    document.getElementById('quote').innerHTML =
      `&ldquo;${q.text}&rdquo;<span class="attr">${q.author ? '— ' + q.author : ''}</span>`;
  })
  .catch(() => {
    document.getElementById('quote').textContent = '';
  });

// ---------------------------------------------------------------
// Claude search box: opens claude.ai/new in a new tab with the typed
// text passed as the q= parameter. NOTE: q= prefill is documented for
// the claude:// desktop deep link, not confirmed for the plain
// https://claude.ai/new web URL — this degrades gracefully to a plain
// new-chat tab if the parameter isn't honored on web.
// ---------------------------------------------------------------
document.getElementById('claude-form').addEventListener('submit', function(e){
  e.preventDefault();
  const val = document.getElementById('claude-input').value.trim();
  const url = val ? `https://claude.ai/new?q=${encodeURIComponent(val)}` : 'https://claude.ai/new';
  window.open(url, '_blank', 'noopener');
  document.getElementById('claude-input').value = '';
});
</script>
